name: Ownership

# A template namespace belongs to the GitHub user or org whose login names it
# (#682). This check reads the pull request's *author* — never the workflow
# actor — and the namespace's OWNERS file on `main`, and fails the PR when
# the author is not an owner. Ownership is pinned to the account's numeric
# id, so a renamed-and-reclaimed login cannot take over a namespace.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  ownership:
    name: Namespace ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = { login: pr.user.login.toLowerCase(), id: pr.user.id };
            const labels = pr.labels.map((l) => l.name);
            const override = labels.includes('maintainer-override');
            const isMaintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association);

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const NS = /^(source-templates|sink-templates)\/([^/]+)\/(.+)$/;
            const TOP = /^(source-templates|sink-templates)\/[^/]+$/;
            const namespaces = new Map();
            const topLevel = [];
            for (const f of files) {
              const m = f.filename.match(NS);
              if (m) {
                const key = `${m[1]}/${m[2]}`;
                if (!namespaces.has(key)) namespaces.set(key, []);
                namespaces.get(key).push(f);
              } else if (TOP.test(f.filename)) {
                topLevel.push(f.filename);
              }
            }

            const problems = [];

            // Official (top-level) templates are maintainers-only.
            if (topLevel.length && !isMaintainer && !override) {
              problems.push(`top-level (official) templates are maintained by faucet-hq — publish yours under source-templates/${author.login}/ instead:\n  - ${topLevel.join('\n  - ')}`);
            }

            async function readYaml(path, ref) {
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path, ref });
                const text = Buffer.from(r.data.content, 'base64').toString('utf8');
                return require('js-yaml') ? require('js-yaml').load(text) : null;
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
            }
            // js-yaml is not available in github-script; parse the tiny OWNERS grammar by hand.
            function parseOwners(text) {
              const out = [];
              for (const line of text.split('\n')) {
                const m = line.match(/^\s*-\s*\{?\s*login:\s*([A-Za-z0-9_-]+)\s*,\s*id:\s*(\d+)/) || line.match(/^\s*-\s*id:\s*(\d+)/);
                if (m) out.push(m.length === 3 ? { login: m[1].toLowerCase(), id: Number(m[2]) } : { id: Number(m[1]) });
              }
              return out;
            }
            async function ownersAt(path, ref) {
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path, ref });
                return parseOwners(Buffer.from(r.data.content, 'base64').toString('utf8'));
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
            }
            async function publicOrgMember(org, user) {
              try {
                await github.rest.orgs.checkPublicMembershipForUser({ org, username: user });
                return true;
              } catch (e) {
                return false;
              }
            }

            for (const [ns, changed] of namespaces) {
              const nsOwner = ns.split('/')[1].toLowerCase();
              const ownersPath = `${ns}/OWNERS`;
              const existing = await ownersAt(ownersPath, pr.base.sha);
              const touchesOwners = changed.some((f) => f.filename === ownersPath);
              if (existing) {
                const ok = existing.some((o) => o.id === author.id);
                if (!ok && !override) {
                  problems.push(`${ns}/ is owned by ${existing.map((o) => o.login || `id ${o.id}`).join(', ')} — @${author.login} is not listed in ${ownersPath}`);
                }
                continue;
              }
              // New namespace: the directory must be the author's login (or an org
              // they are a public member of), and the PR must add OWNERS naming them.
              const claimOk = nsOwner === author.login || (await publicOrgMember(nsOwner, pr.user.login));
              if (!claimOk && !override) {
                problems.push(`${ns}/ is a new namespace but '${nsOwner}' is neither your login (@${author.login}) nor an org you are a public member of`);
                continue;
              }
              if (!touchesOwners) {
                problems.push(`${ns}/ is a new namespace — add ${ownersPath} with:\n  owners:\n    - { login: ${author.login}, id: ${author.id} }`);
                continue;
              }
              const proposed = await ownersAt(ownersPath, pr.head.sha);
              if (!proposed || !proposed.some((o) => o.id === author.id)) {
                problems.push(`${ownersPath} must list the PR author: { login: ${author.login}, id: ${author.id} }`);
              }
              // Every template in the namespace must declare its owner.
              for (const f of changed) {
                if (!/\.(ya?ml|json)$/.test(f.filename) || /\.faucet\.(ya?ml|json)$/.test(f.filename) || f.status === 'removed') continue;
                try {
                  const r = await github.rest.repos.getContent({ owner, repo, path: f.filename, ref: pr.head.sha });
                  const text = Buffer.from(r.data.content, 'base64').toString('utf8');
                  if (!new RegExp(`^owner:\\s*${nsOwner}\\s*$`, 'm').test(text)) {
                    problems.push(`${f.filename}: add \`owner: ${nsOwner}\` — a template under ${ns}/ must declare its namespace`);
                  }
                } catch (e) { /* binary or missing — the lint job reports it */ }
              }
            }

            if (problems.length) {
              core.setFailed(`Ownership check failed for @${author.login}:\n\n- ${problems.join('\n- ')}\n\nSee CONTRIBUTING.md → "Namespaces and ownership".`);
            } else {
              core.info(`ownership ok for @${author.login} (${namespaces.size} namespace(s), ${topLevel.length} official file(s))`);
            }
