      fieldMask: customer.id,segments.date,campaign.id,adGroup.id,adGroupAd.ad.id,metrics.impressions,metrics.clicks,metrics.costMicros,metrics.interactions,metrics.conversions,metrics.conversionsValue,metrics.allConversions,metrics.viewThroughConversions
