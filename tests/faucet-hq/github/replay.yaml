      updated_at: '2024-04-02T10:00:00Z'
      closed_at: '2024-04-02T10:00:00Z'
    headers:
      Link: <{replay}/repos/octo-org/octo-repo/issues?per_page=100&state=all&sort=updated&direction=asc&since=1970-01-01T00:00:00Z&page=2>; rel="next", <{replay}/repos/octo-org/octo-repo/issues?per_page=100&state=all&sort=updated&direction=asc&since=1970-01-01T00:00:00Z&page=2>;
        rel="last"
- match:
    path: /repos/octo-org/octo-repo/issues
    headers: *id001
    query:
      per_page: '100'
      state: all
      sort: updated
      direction: asc
      since: '1970-01-01T00:00:00Z'
