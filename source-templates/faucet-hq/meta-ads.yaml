# Meta Marketing API v25.0 — one ad account per run: account, campaigns, ad
# sets, ads and creatives from the Graph edges, and daily Insights through
# asynchronous report runs. Every endpoint, parameter and limit below is taken
# from developers.facebook.com/docs/marketing-api; the per-stream doc links are
# in meta-ads.md beside this file.
kind: source-template
name: meta-ads
owner: faucet-hq
description: Meta Marketing API v25.0 — ad account, campaigns, ad sets, ads, creatives and daily Insights (async report runs)
tags: [marketing, advertising, meta, facebook]
docs: https://developers.facebook.com/docs/marketing-api
params:
  meta_ad_account_id: { type: string, required: true, description: "Ad account id, digits only (the part after act_)" }
  meta_access_token:
    type: string
    required: true
    secret: true
    description: "System-user (or user) access token with the ads_read permission on the ad account"
  meta_insights_date_preset:
    type: string
    default: last_28d
    values: [last_3d, last_7d, last_14d, last_28d, last_30d, last_90d, this_month, last_month, this_year, last_year, maximum]
    description: "Insights window re-read every run; Insights stop changing 28 days after they are reported, so last_28d re-reads every day that can still move"
  meta_graph_url: { type: string, default: "https://graph.facebook.com", description: "Graph API root" }
source:
  type: rest
  config:
    base_url: "${param.meta_graph_url}"
    auth: { type: bearer, config: { token: "${param.meta_access_token}" } }
    records_path: "$.data[*]"
    pagination: { type: NextLinkInBody, next_link_path: "$.paging.next" }
    max_pages: null
    timeout: 120
    max_retries: 5
    # Throttling answers a Graph error (HTTP 400/403) whose error.code names the
    # limit: 4 app, 17 user, 613 / 80000-80014 ad-account business-use-case.
    retry_on_response:
      - { status: [400, 403, 429], body_path: "$.error.code", values: [4, 17, 32, 613, 80000, 80003, 80004, 80014], backoff_secs: 60 }
sources:
  insights:
    type: rest
    config:
      base_url: "${param.meta_graph_url}"
      auth: { type: bearer, config: { token: "${param.meta_access_token}" } }
      pagination: { type: None }
      timeout: 120
      max_retries: 5
      retry_on_response:
        - { status: [400, 403, 429], body_path: "$.error.code", values: [4, 17, 32, 613, 80000, 80003, 80004, 80014], backoff_secs: 60 }
      async_job:
        # Overridden per stream: POST act_<id>/insights starts an Ad Report Run.
        submit: { method: POST, url: "/v25.0/act_${param.meta_ad_account_id}/insights" }
        job_id: "$.report_run_id"
        poll: { url: "/v25.0/${job_id}", interval_secs: 30, timeout_secs: 3600 }
        status: { path: "$.async_status", success: [Job Completed], failure: [Job Failed, Job Skipped] }
        fetch:
          url: "/v25.0/${job_id}/insights"
          query: { limit: "500" }
          records_path: "$.data[*]"
          locator_body: "$.paging.cursors.after"
          locator_param: after
transforms:
  - { type: keys_case, config: { mode: snake } }
streams:
  - name: ad_account
    source:
      config:
        path: "/v25.0/act_${param.meta_ad_account_id}"
        records_path: null
        pagination: { type: None }
        query_params:
          fields: id,account_id,name,account_status,currency,timezone_name,timezone_offset_hours_utc,amount_spent,spend_cap,balance,business,created_time,disable_reason
    transforms:
      - { type: json_encode, config: { fields: [business] } }
    primary_keys: [id]
    write: [overwrite, upsert]

  - name: campaigns
    source:
      config:
        path: "/v25.0/act_${param.meta_ad_account_id}/campaigns"
        query_params:
          limit: "500"
          effective_status: '["ACTIVE","PAUSED","DELETED","PENDING_REVIEW","DISAPPROVED","PREAPPROVED","PENDING_BILLING_INFO","CAMPAIGN_PAUSED","ARCHIVED","ADSET_PAUSED","IN_PROCESS","WITH_ISSUES"]'
          fields: id,name,account_id,objective,status,effective_status,configured_status,buying_type,bid_strategy,daily_budget,lifetime_budget,budget_remaining,special_ad_categories,start_time,stop_time,created_time,updated_time
    transforms:
      - { type: json_encode, config: { fields: [special_ad_categories] } }
    primary_keys: [id]
    write: [overwrite, upsert]

  - name: ad_sets
    source:
      config:
        path: "/v25.0/act_${param.meta_ad_account_id}/adsets"
        query_params:
          limit: "500"
          effective_status: '["ACTIVE","PAUSED","DELETED","PENDING_REVIEW","DISAPPROVED","PREAPPROVED","PENDING_BILLING_INFO","CAMPAIGN_PAUSED","ARCHIVED","ADSET_PAUSED","IN_PROCESS","WITH_ISSUES"]'
          fields: id,name,account_id,campaign_id,status,effective_status,configured_status,optimization_goal,billing_event,bid_strategy,bid_amount,daily_budget,lifetime_budget,budget_remaining,targeting,promoted_object,start_time,end_time,created_time,updated_time
    transforms:
      - { type: json_encode, config: { fields: [targeting, promoted_object] } }
    primary_keys: [id]
    write: [overwrite, upsert]

  - name: ads
    source:
      config:
        path: "/v25.0/act_${param.meta_ad_account_id}/ads"
        query_params:
          limit: "500"
          effective_status: '["ACTIVE","PAUSED","DELETED","PENDING_REVIEW","DISAPPROVED","PREAPPROVED","PENDING_BILLING_INFO","CAMPAIGN_PAUSED","ARCHIVED","ADSET_PAUSED","IN_PROCESS","WITH_ISSUES"]'
          fields: id,name,account_id,campaign_id,adset_id,status,effective_status,configured_status,creative,tracking_specs,created_time,updated_time
    transforms:
      - { type: json_encode, config: { fields: [creative, tracking_specs] } }
    primary_keys: [id]
    write: [overwrite, upsert]

  - name: ad_creatives
    source:
      config:
        path: "/v25.0/act_${param.meta_ad_account_id}/adcreatives"
        query_params:
          limit: "200"
          fields: id,name,account_id,status,title,body,object_type,call_to_action_type,thumbnail_url,image_url,url_tags,effective_object_story_id,object_story_spec,asset_feed_spec
    transforms:
      - { type: json_encode, config: { fields: [object_story_spec, asset_feed_spec] } }
    primary_keys: [id]
    write: [overwrite, upsert]

  # Daily Insights, one async report run per stream (level × breakdowns).
  - name: campaign_insights
    source:
      ref: insights
      config:
        async_job:
          submit:
            query:
              level: campaign
              time_increment: "1"
              date_preset: "${param.meta_insights_date_preset}"
              use_unified_attribution_setting: "true"
              fields: account_id,account_currency,campaign_id,campaign_name,date_start,date_stop,impressions,reach,frequency,clicks,unique_clicks,inline_link_clicks,spend,cpc,cpm,ctr,actions,action_values,cost_per_action_type
    transforms: &insights_shape
      - { type: json_encode, config: { fields: [actions, action_values, cost_per_action_type] } }
      - { type: cast, config: { fields: { impressions: int, reach: int, clicks: int, unique_clicks: int, inline_link_clicks: int, spend: float, frequency: float, cpc: float, cpm: float, ctr: float }, on_error: error } }
    primary_keys: [campaign_id, date_start]
    write: [upsert, append]

  - name: ad_insights
    source:
      ref: insights
      config:
        async_job:
          submit:
            query:
              level: ad
              time_increment: "1"
              date_preset: "${param.meta_insights_date_preset}"
              use_unified_attribution_setting: "true"
              fields: account_id,account_currency,campaign_id,campaign_name,adset_id,adset_name,ad_id,ad_name,date_start,date_stop,impressions,reach,frequency,clicks,unique_clicks,inline_link_clicks,spend,cpc,cpm,ctr,actions,action_values,cost_per_action_type
    transforms: *insights_shape
    primary_keys: [ad_id, date_start]
    write: [upsert, append]

  - name: ad_insights_age_gender
    source:
      ref: insights
      config:
        async_job:
          submit:
            query:
              level: ad
              time_increment: "1"
              breakdowns: age,gender
              date_preset: "${param.meta_insights_date_preset}"
              use_unified_attribution_setting: "true"
              fields: account_id,campaign_id,adset_id,ad_id,date_start,date_stop,impressions,reach,clicks,inline_link_clicks,spend,actions,action_values
    transforms: *insights_shape
    primary_keys: [ad_id, date_start, age, gender]
    write: [upsert, append]

  - name: ad_insights_country
    source:
      ref: insights
      config:
        async_job:
          submit:
            query:
              level: ad
              time_increment: "1"
              breakdowns: country
              date_preset: "${param.meta_insights_date_preset}"
              use_unified_attribution_setting: "true"
              fields: account_id,campaign_id,adset_id,ad_id,date_start,date_stop,impressions,reach,clicks,inline_link_clicks,spend,actions,action_values
    transforms: *insights_shape
    primary_keys: [ad_id, date_start, country]
    write: [upsert, append]

  - name: ad_insights_platform
    source:
      ref: insights
      config:
        async_job:
          submit:
            query:
              level: ad
              time_increment: "1"
              breakdowns: publisher_platform,platform_position
              date_preset: "${param.meta_insights_date_preset}"
              use_unified_attribution_setting: "true"
              fields: account_id,campaign_id,adset_id,ad_id,date_start,date_stop,impressions,reach,clicks,inline_link_clicks,spend,actions,action_values
    transforms: *insights_shape
    primary_keys: [ad_id, date_start, publisher_platform, platform_position]
    write: [upsert, append]
