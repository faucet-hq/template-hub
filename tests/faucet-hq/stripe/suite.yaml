# Parameter-space suite for faucet-hq/stripe (faucet template test, #648).
# Validation tier: the composed pipeline materializes, expands and compiles for
# every case. Behavioural tier: recorded records through the shared transforms
# of the first stream. The HTTP side (auth, pagination, cursors, bookmarks) is
# covered by replay.yaml — see scripts/replay.py.
version: 1
template: source-templates/faucet-hq/stripe.yaml
sink: sink-templates/faucet-hq/sqlite.yaml
suite:
  auto:
    required_omitted: true
    defaults_baseline: true
  cases:
    - name: restricted-key
      params: { stripe_api_key: rk_test_replay }
    - name: fixture-base-url
      params: { stripe_api_key: sk_test_replay, api_base_url: "http://127.0.0.1:9" }
  behavioral:
    - name: customers-pass-through-unchanged
      params: { stripe_api_key: sk_test_replay }
      input: tests/faucet-hq/stripe/expected/customers.jsonl
      expect:
        records_written: 3
        match: subset
        unordered: true
        records:
          - { id: cus_Q1a, email: ada@example.com, metadata: { segment: smb } }
          - { id: cus_Q2b, balance: -500 }
          - { id: cus_Q3c, delinquent: true }
