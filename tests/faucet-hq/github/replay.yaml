# Recorded GitHub REST exchanges (shapes from the API reference, values
# synthetic — no live credentials). Two runs: the second proves issues and
# issue_comments resume with `since=<last updated_at>`; issues pages twice via
# the Link header.
runs: 2
overlay: ../../state-overlay.yaml
params:
  github_token: ghp_replay
  github_owner: octo-org
  github_repo: octo-repo
  api_base_url: '{replay}'
exchanges:
- match:
    path: /repos/octo-org/octo-repo
    headers: &id001
      authorization: Bearer ghp_replay
      x-github-api-version: '2022-11-28'
      accept: application/vnd.github+json
  response:
    body:
      id: 1296269
      node_id: MDEwOlJlcG9zaXRvcnkxMjk2MjY5
      name: octo-repo
      full_name: octo-org/octo-repo
      private: false
      owner:
        login: octo-org
        id: 9919
        type: Organization
      default_branch: main
      stargazers_count: 80
      forks_count: 9
      open_issues_count: 2
      created_at: '2011-01-26T19:01:12Z'
      updated_at: '2024-05-01T10:00:00Z'
      pushed_at: '2024-05-01T09:00:00Z'
- match:
    path: /repos/octo-org/octo-repo/issues
    headers: *id001
    query:
      per_page: '100'
      state: all
      sort: updated
      direction: asc
      since: '1970-01-01T00:00:00Z'
    absent:
    - page
  response:
    body:
    - id: 1
      number: 1347
