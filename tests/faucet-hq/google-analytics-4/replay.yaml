# Recorded GA4 Data API exchanges for faucet-hq/google-analytics-4, built from
# the documented runReport response schema with synthetic values. The service
# account key is a throwaway RSA key generated for this fixture; the token
# endpoint is served by the replay.
#
# Run 1 has no bookmark: one window from ga4_start_date minus the 3-day
# lookback (2023-12-29) to now — ga4_window_days is set wide so the window
# count does not depend on today's date — and traffic_daily pages by body
# offset (page size 2: 2 rows, then 1). Run 2 resumes 3 days before the
# bookmark; its start date moves with the clock, so those exchanges match on
# the report shape and offset only. Every other stream returns a restated row
# on run 2 (upserted over the first), traffic_daily returns no rows (GA4 then
# omits `rows`), so its expected output is run 1's three rows.
