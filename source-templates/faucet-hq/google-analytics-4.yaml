# Google Analytics 4 — daily reports through the GA4 Data API (runReport).
#   faucet run --source faucet-hq/google-analytics-4 --sink faucet-hq/bigquery \
#     --param ga4_property_id=123456789 --param google_client_id=… \
#     --param google_client_secret="$SECRET" --param google_refresh_token="$REFRESH" …
# Scopes, run times and the changelog: google-analytics-4.md beside this file.
#
# Each stream requests its dimensions and metrics once (YAML anchors) and hands
# the same lists to zip_columns as the headers, so a report column can never be
# named from a different list than the one requested.
kind: source-template
name: google-analytics-4
owner: faucet-hq
description: Google Analytics 4 — daily traffic, pages, events, devices, geography and acquisition reports over a rolling window (GA4 Data API v1beta)
tags: [analytics, marketing, saas]
docs: https://developers.google.com/analytics/devguides/reporting/data/v1
params:
  ga4_property_id:      { type: string, required: true, description: "Numeric GA4 property id (Admin → Property settings), not the G- measurement id" }
  google_client_id:     { type: string, required: true, description: "OAuth client id (Google Cloud console)" }
  google_client_secret: { type: string, required: true, secret: true, description: "OAuth client secret" }
  google_refresh_token: { type: string, required: true, secret: true, description: "OAuth refresh token with the https://www.googleapis.com/auth/analytics.readonly scope" }
  report_window:        { type: string, default: 30daysAgo, values: [7daysAgo, 14daysAgo, 30daysAgo, 90daysAgo], description: "Start of the rolling window every stream re-reads each run (GA4 keeps processing data for up to 72 hours)" }
  report_page_size:     { type: int, default: 100000, description: "Rows per runReport request (GA4 allows up to 250000)" }
  google_token_url:     { type: string, default: "https://oauth2.googleapis.com/token", description: "OAuth token endpoint — override only to replay recorded fixtures" }
  api_base_url:         { type: string, default: "https://analyticsdata.googleapis.com", description: "API root — override only to replay recorded fixtures" }
auth:
  ga4:
    type: oauth2_refresh
    config:
      token_url: "${param.google_token_url}"
      client_id: "${param.google_client_id}"
      client_secret: "${param.google_client_secret}"
      refresh_token: "${param.google_refresh_token}"
source:
  type: rest
  config:
    base_url: "${param.api_base_url}"
    path: "/v1beta/properties/${param.ga4_property_id}:runReport"
    method: POST
    auth: { ref: ga4 }
    body: { dateRanges: [{ startDate: "${param.report_window}", endDate: yesterday }], keepEmptyRows: false }
    records_path: $.rows[*]
    pagination: { type: OffsetInBody, offset_field: offset, limit_field: limit, limit: "${param.report_page_size}" }
    max_pages: null
    max_retries: 6
streams:
  - name: daily_traffic
    source:
      config:
        body:
          dimensions: &traffic_d [{ name: date }, { name: sessionDefaultChannelGroup }]
          metrics: &traffic_m [{ name: sessions }, { name: totalUsers }, { name: newUsers }, { name: screenPageViews }, { name: engagementRate }, { name: keyEvents }]
    transforms:
      - { type: set, config: { values: { _dimensions: *traffic_d, _metrics: *traffic_m } } }
      - &zip { type: zip_columns, config: { rows_path: "$", groups: [{ from: dimensionValues, header: "$._dimensions[*].name", value: value }, { from: metricValues, header: "$._metrics[*].name", value: value }] } }
      - &snake { type: keys_case, config: { mode: snake } }
    primary_keys: [date, session_default_channel_group]
    write: [upsert, overwrite]
  - name: pages
    source:
      config:
        body:
          dimensions: &pages_d [{ name: date }, { name: hostName }, { name: pagePath }]
          metrics: &pages_m [{ name: screenPageViews }, { name: activeUsers }, { name: averageSessionDuration }]
    transforms:
      - { type: set, config: { values: { _dimensions: *pages_d, _metrics: *pages_m } } }
      - *zip
      - *snake
    primary_keys: [date, host_name, page_path]
    write: [upsert, overwrite]
  - name: events
    source:
      config:
        body:
          dimensions: &events_d [{ name: date }, { name: eventName }]
          metrics: &events_m [{ name: eventCount }, { name: totalUsers }]
    transforms:
      - { type: set, config: { values: { _dimensions: *events_d, _metrics: *events_m } } }
      - *zip
      - *snake
    primary_keys: [date, event_name]
    write: [upsert, overwrite]
  - name: devices
    source:
      config:
        body:
          dimensions: &devices_d [{ name: date }, { name: deviceCategory }, { name: operatingSystem }]
          metrics: &devices_m [{ name: sessions }, { name: totalUsers }]
    transforms:
      - { type: set, config: { values: { _dimensions: *devices_d, _metrics: *devices_m } } }
      - *zip
      - *snake
    primary_keys: [date, device_category, operating_system]
    write: [upsert, overwrite]
  - name: geography
    source:
      config:
        body:
          dimensions: &geo_d [{ name: date }, { name: country }, { name: region }, { name: city }]
          metrics: &geo_m [{ name: sessions }, { name: totalUsers }]
    transforms:
      - { type: set, config: { values: { _dimensions: *geo_d, _metrics: *geo_m } } }
      - *zip
      - *snake
    primary_keys: [date, country, region, city]
    write: [upsert, overwrite]
  - name: acquisition
    source:
      config:
        body:
          dimensions: &acq_d [{ name: date }, { name: sessionSource }, { name: sessionMedium }, { name: sessionCampaignName }]
          metrics: &acq_m [{ name: sessions }, { name: totalUsers }, { name: keyEvents }]
    transforms:
      - { type: set, config: { values: { _dimensions: *acq_d, _metrics: *acq_m } } }
      - *zip
      - *snake
    primary_keys: [date, session_source, session_medium, session_campaign_name]
    write: [upsert, overwrite]
