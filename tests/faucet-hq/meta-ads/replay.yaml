# Recorded Meta Marketing API exchanges (shapes from the Graph API reference,
# values synthetic — no live credentials). Entity lists page through
# paging.next (campaigns twice); ad_insights submits an async report run,
# polls it to "Job Completed" and reads its results through paging.cursors.after
# (the final empty page is how the cursor loop learns it is done).
params:
  meta_ad_account_id: '1234567890'
  meta_access_token: EAAreplay
  api_base_url: '{replay}'
exchanges:
- match:
    path: /v24.0/act_1234567890
    headers: &id001
      authorization: Bearer EAAreplay
    query:
      fields: id,account_id,name,account_status,currency,timezone_name,amount_spent,balance,spend_cap,business,created_time
  response:
    body:
      id: act_1234567890
      account_id: '1234567890'
      name: Acme Ads
      account_status: 1
      currency: USD
      timezone_name: America/Los_Angeles
      amount_spent: '1234567'
      balance: '0'
      spend_cap: '0'
      business:
        id: '10150'
        name: Acme
      created_time: 2020-01-01T00:00:00-0800
- match:
    path: /v24.0/act_1234567890/campaigns
    headers: *id001
    query:
      fields: id,name,status,effective_status,objective,buying_type,daily_budget,lifetime_budget,budget_remaining,start_time,stop_time,created_time,updated_time
      limit: '500'
    absent:
    - after
  response:
    body:
      data:
      - id: '120200000000001'
        name: Spring sale
        status: ACTIVE
        effective_status: ACTIVE
        objective: OUTCOME_SALES
        buying_type: AUCTION
        daily_budget: '5000'
        budget_remaining: '4200'
        start_time: 2024-03-01T00:00:00-0800
        created_time: 2024-02-20T10:00:00-0800
        updated_time: 2024-04-01T10:00:00-0700
      paging:
        cursors:
          before: QVFIUb
          after: QVFIU0
        next: '{replay}/v24.0/act_1234567890/campaigns?limit=500&after=QVFIU0'
- match:
    path: /v24.0/act_1234567890/campaigns
    headers: *id001
    query:
      limit: '500'
      after: QVFIU0
  response:
    body:
      data:
      - id: '120200000000002'
        name: Retargeting
        status: PAUSED
        effective_status: PAUSED
        objective: OUTCOME_TRAFFIC
        buying_type: AUCTION
        lifetime_budget: '100000'
        budget_remaining: '0'
        start_time: 2024-01-01T00:00:00-0800
        created_time: 2023-12-20T10:00:00-0800
        updated_time: 2024-02-01T10:00:00-0800
      paging:
        cursors:
          before: QVFIUb
          after: QVFIU1
- match:
    path: /v24.0/act_1234567890/adsets
    headers: *id001
    query:
      fields: id,name,campaign_id,status,effective_status,optimization_goal,billing_event,bid_strategy,daily_budget,lifetime_budget,targeting,start_time,end_time,created_time,updated_time
      limit: '500'
    absent:
    - after
  response:
    body:
      data:
      - id: '120210000000001'
        name: US 25-44
        campaign_id: '120200000000001'
        status: ACTIVE
        effective_status: ACTIVE
        optimization_goal: OFFSITE_CONVERSIONS
        billing_event: IMPRESSIONS
        bid_strategy: LOWEST_COST_WITHOUT_CAP
        targeting:
          geo_locations:
            countries:
            - US
          age_min: 25
          age_max: 44
        start_time: 2024-03-01T00:00:00-0800
        created_time: 2024-02-20T10:05:00-0800
        updated_time: 2024-04-01T10:00:00-0700
      paging:
        cursors:
          before: QVFIUb
          after: QVFIU0
- match:
    path: /v24.0/act_1234567890/ads
    headers: *id001
    query:
      fields: id,name,adset_id,campaign_id,status,effective_status,creative{id},created_time,updated_time
      limit: '500'
    absent:
    - after
  response:
    body:
      data:
      - id: '120220000000001'
        name: Carousel A
        adset_id: '120210000000001'
        campaign_id: '120200000000001'
        status: ACTIVE
        effective_status: ACTIVE
        creative:
          id: '120230000000001'
        created_time: 2024-02-20T10:10:00-0800
        updated_time: 2024-04-01T10:00:00-0700
      paging:
        cursors:
          before: QVFIUb
          after: QVFIU0
- match:
    path: /v24.0/act_1234567890/adcreatives
    headers: *id001
    query:
      fields: id,name,title,body,object_type,status,call_to_action_type,thumbnail_url
      limit: '500'
    absent:
    - after
  response:
    body:
      data:
      - id: '120230000000001'
        name: Carousel A creative
        title: Spring sale
        body: Up to 30% off
        object_type: SHARE
        status: ACTIVE
        call_to_action_type: SHOP_NOW
        thumbnail_url: https://example.com/thumb.jpg
      paging:
        cursors:
          before: QVFIUb
          after: QVFIU0
- match:
    method: POST
    path: /v24.0/act_1234567890/insights
    headers: *id001
    query:
      level: ad
      time_increment: '1'
      date_preset: last_28d
      fields: account_id,campaign_id,campaign_name,adset_id,adset_name,ad_id,ad_name,date_start,date_stop,impressions,reach,frequency,clicks,unique_clicks,ctr,cpc,cpm,spend,actions,action_values
  response:
    body:
      report_run_id: '6097000000001'
- match:
    path: /v24.0/6097000000001
    headers: *id001
  response:
    body:
      id: '6097000000001'
      account_id: '1234567890'
      async_status: Job Completed
      async_percent_completion: 100
      date_start: '2024-03-05'
      date_stop: '2024-04-01'
- match:
    path: /v24.0/6097000000001/insights
    headers: *id001
    query:
      limit: '500'
    absent:
    - after
  response:
    body:
      data:
      - account_id: '1234567890'
        campaign_id: '120200000000001'
        campaign_name: Spring sale
        adset_id: '120210000000001'
        adset_name: US 25-44
        ad_id: '120220000000001'
        ad_name: Carousel A
        date_start: '2024-03-31'
        date_stop: '2024-03-31'
        impressions: '1600'
        reach: '1280'
        frequency: '1.25'
        clicks: '40'
        unique_clicks: '38'
        ctr: '2.5'
        cpc: '0.35'
        cpm: '8.75'
        spend: '14.00'
        actions:
        - action_type: link_click
          value: '40'
        - action_type: offsite_conversion.fb_pixel_purchase
          value: '3'
        action_values:
        - action_type: offsite_conversion.fb_pixel_purchase
          value: '189.00'
      paging:
        cursors:
          before: MAZDZD
          after: MQZDZD
        next: '{replay}/v24.0/6097000000001/insights?limit=500&after=MQZDZD'
- match:
    path: /v24.0/6097000000001/insights
    headers: *id001
    query:
      limit: '500'
      after: MQZDZD
  response:
    body:
      data:
      - account_id: '1234567890'
        campaign_id: '120200000000001'
        campaign_name: Spring sale
        adset_id: '120210000000001'
        adset_name: US 25-44
        ad_id: '120220000000001'
        ad_name: Carousel A
        date_start: '2024-04-01'
        date_stop: '2024-04-01'
        impressions: '1400'
        reach: '1120'
        frequency: '1.25'
        clicks: '35'
        unique_clicks: '33'
        ctr: '2.5'
        cpc: '0.35'
        cpm: '8.75'
        spend: '12.25'
        actions:
        - action_type: link_click
          value: '35'
        - action_type: offsite_conversion.fb_pixel_purchase
          value: '3'
        action_values:
        - action_type: offsite_conversion.fb_pixel_purchase
          value: '189.00'
      paging:
        cursors:
          before: MQZDZD
          after: MgZDZD
- match:
    path: /v24.0/6097000000001/insights
    headers: *id001
    query:
      limit: '500'
      after: MgZDZD
  response:
