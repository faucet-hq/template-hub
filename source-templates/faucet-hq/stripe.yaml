# Stripe — payments, billing and the balance ledger over the REST API.
#   faucet run --source faucet-hq/stripe --sink faucet-hq/bigquery --param stripe_api_key="$STRIPE_KEY" …
# Scopes, run times and the changelog: stripe.md beside this file.
kind: source-template
name: stripe
owner: faucet-hq
description: Stripe — customers, subscriptions, invoices, charges, refunds, payment intents, products, prices, payouts, balance transactions and events
tags: [payments, billing, finance, saas]
docs: https://docs.stripe.com/api
params:
  stripe_api_key: { type: string, required: true, secret: true, description: "Secret or restricted API key (read-only restricted key recommended)" }
  api_base_url:   { type: string, default: "https://api.stripe.com", description: "API root — override only to replay recorded fixtures" }
source:
  type: rest
  config:
    base_url: "${param.api_base_url}"
    auth: { type: bearer, config: { token: "${param.stripe_api_key}" } }
    headers:
      Stripe-Version: "2024-06-20"
    query_params: { limit: "100" }
    records_path: $.data[*]
    pagination: { type: Cursor, next_token_path: "$.data[-1:].id", param_name: starting_after }
    max_pages: null
    max_retries: 5
streams:
  - name: customers
    source: { config: { path: /v1/customers } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: subscriptions
    source: { config: { path: /v1/subscriptions, query_params: { limit: "100", status: all } } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: invoices
    source: { config: { path: /v1/invoices } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: charges
    source: { config: { path: /v1/charges } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: refunds
    source: { config: { path: /v1/refunds } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: payment_intents
    source: { config: { path: /v1/payment_intents } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: products
    source: { config: { path: /v1/products } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: prices
    source: { config: { path: /v1/prices } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: payouts
    source: { config: { path: /v1/payouts } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: balance_transactions
    source:
      config:
        path: /v1/balance_transactions
        replication_method: { type: Incremental }
        replication_key: created
        replication_bind: { into: query, name: "created[gt]", format: raw }
    primary_keys: [id]
    write: [upsert, overwrite]
  - name: events
    source:
      config:
        path: /v1/events
        replication_method: { type: Incremental }
        replication_key: created
        replication_bind: { into: query, name: "created[gt]", format: raw }
    primary_keys: [id]
    write: [upsert, overwrite]
