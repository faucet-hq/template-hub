# Recorded HubSpot CRM v3 exchanges (shapes from the API reference, values
# synthetic — no live credentials). contacts pages twice through
# paging.next.after; the expected records show properties lifted to columns.
params:
  hubspot_token: pat-na1-replay
  api_base_url: '{replay}'
exchanges:
- match:
    path: /crm/v3/objects/contacts
    headers: &id001
      authorization: Bearer pat-na1-replay
    query:
      limit: '100'
      archived: 'false'
      properties: email,firstname,lastname,phone,company,jobtitle,lifecyclestage,hs_lead_status,hubspot_owner_id,createdate,lastmodifieddate
    absent:
    - after
  response:
    body:
      results:
      - id: '101'
        properties:
          hs_object_id: '101'
          email: ada@example.com
          firstname: Ada
          lastname: Lovelace
          lifecyclestage: customer
          hubspot_owner_id: '77'
          createdate: '2024-01-02T10:00:00.000Z'
          lastmodifieddate: '2024-04-01T10:00:00.000Z'
        createdAt: '2024-01-02T10:00:00.000Z'
        updatedAt: '2024-04-01T10:00:00.000Z'
        archived: false
      paging:
        next:
          after: '102'
          link: https://api.hubapi.com/crm/v3/objects/contacts?after=102
- match:
    path: /crm/v3/objects/contacts
    headers: *id001
    query:
      limit: '100'
      archived: 'false'
      properties: email,firstname,lastname,phone,company,jobtitle,lifecyclestage,hs_lead_status,hubspot_owner_id,createdate,lastmodifieddate
      after: '102'
  response:
    body:
      results:
      - id: '102'
        properties:
          hs_object_id: '102'
          email: alan@example.com
          firstname: Alan
          lastname: Turing
          lifecyclestage: lead
          hubspot_owner_id: null
          createdate: '2024-01-03T10:00:00.000Z'
          lastmodifieddate: '2024-04-02T10:00:00.000Z'
        createdAt: '2024-01-02T10:00:00.000Z'
        updatedAt: '2024-04-01T10:00:00.000Z'
        archived: false
- match:
    path: /crm/v3/objects/companies
    headers: *id001
    query:
      limit: '100'
      archived: 'false'
  response:
    body:
      results:
      - id: '201'
        properties:
          hs_object_id: '201'
          name: Acme Corp
          domain: acme.example
          industry: COMPUTER_SOFTWARE
          numberofemployees: '250'
          annualrevenue: '12000000'
          createdate: '2023-06-01T00:00:00.000Z'
          hs_lastmodifieddate: '2024-03-01T00:00:00.000Z'
        createdAt: '2024-01-02T10:00:00.000Z'
        updatedAt: '2024-04-01T10:00:00.000Z'
        archived: false
- match:
    path: /crm/v3/objects/deals
    headers: *id001
    query:
      limit: '100'
      archived: 'false'
  response:
    body:
      results:
      - id: '301'
        properties:
          hs_object_id: '301'
          dealname: Acme renewal
          amount: '48000'
          dealstage: closedwon
          pipeline: default
          closedate: '2024-03-31T00:00:00.000Z'
          hs_is_closed_won: 'true'
          createdate: '2024-02-01T00:00:00.000Z'
          hs_lastmodifieddate: '2024-03-31T00:00:00.000Z'
        createdAt: '2024-01-02T10:00:00.000Z'
        updatedAt: '2024-04-01T10:00:00.000Z'
        archived: false
- match:
    path: /crm/v3/objects/tickets
    headers: *id001
    query:
      limit: '100'
      archived: 'false'
  response:
    body:
      results:
      - id: '401'
        properties:
          hs_object_id: '401'
          subject: Cannot log in
          hs_pipeline: '0'
          hs_pipeline_stage: '1'
          hs_ticket_priority: HIGH
          createdate: '2024-04-01T08:00:00.000Z'
          hs_lastmodifieddate: '2024-04-01T09:00:00.000Z'
        createdAt: '2024-01-02T10:00:00.000Z'
        updatedAt: '2024-04-01T10:00:00.000Z'
        archived: false
- match:
    path: /crm/v3/objects/products
    headers: *id001
    query:
      limit: '100'
      archived: 'false'
  response:
    body:
      results:
      - id: '501'
        properties:
          hs_object_id: '501'
          name: Pro plan
          price: '49'
          hs_sku: PRO-M
          hs_recurring_billing_period: P1M
          createdate: '2023-01-01T00:00:00.000Z'
          hs_lastmodifieddate: '2023-01-01T00:00:00.000Z'
        createdAt: '2024-01-02T10:00:00.000Z'
        updatedAt: '2024-04-01T10:00:00.000Z'
        archived: false
- match:
    path: /crm/v3/owners
    headers: *id001
    query:
      limit: '100'
      archived: 'false'
  response:
    body:
      results:
      - id: '77'
        email: sam@example.com
        type: PERSON
        firstName: Sam
        lastName: Seller
        userId: 9001
        teams:
        - id: '12'
          name: EMEA
          primary: true
        createdAt: '2022-01-01T00:00:00Z'
        updatedAt: '2024-01-01T00:00:00Z'
        archived: false
- match:
    path: /crm/v3/pipelines/deals
    headers: *id001
    query:
      archived: 'false'
    absent:
    - after
  response:
    body:
      results:
      - id: default
        label: Sales Pipeline
        displayOrder: 0
        archived: false
        stages:
        - id: appointmentscheduled
          label: Appointment Scheduled
          displayOrder: 0
          metadata:
            probability: '0.2'
        - id: closedwon
          label: Closed Won
          displayOrder: 1
          metadata:
            probability: '1.0'
            isClosed: 'true'
        createdAt: '2020-01-01T00:00:00Z'
        updatedAt: '2023-01-01T00:00:00Z'
