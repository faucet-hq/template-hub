# Recorded Meta Marketing API v25.0 exchanges for faucet-hq/meta-ads, built
# from the documented Graph responses with synthetic values.
# - campaigns: two pages via paging.next;
# - Insights: POST act_<id>/insights starts a report run, GET <run> polls
#   async_status, GET <run>/insights fetches; ad_insights pages by
#   paging.cursors.after until an empty page.
# Every stream is a full refresh or a stateless rolling date_preset window, so
# one run covers the template.
params:
  meta_graph_url: '{replay}'
  meta_ad_account_id: '1234567890'
  meta_access_token: meta_replay_token
exchanges:
- match:
    path: /v25.0/act_1234567890
    query:
      fields: id,account_id,name,account_status,currency,timezone_name,timezone_offset_hours_utc,amount_spent,spend_cap,balance,business,created_time,disable_reason
    headers:
      authorization: Bearer meta_replay_token
  response:
    body:
      id: act_1234567890
      account_id: '1234567890'
      name: Demo Store
      account_status: 1
      currency: USD
      timezone_name: America/Los_Angeles
      timezone_offset_hours_utc: -7
      amount_spent: '1234567'
      spend_cap: '0'
      balance: '0'
      business:
        id: '555000'
        name: Demo Store LLC
      created_time: 2022-05-01T10:00:00-0700
      disable_reason: 0
- match:
    path: /v25.0/act_1234567890/campaigns
    query:
      limit: '500'
      effective_status: '["ACTIVE","PAUSED","DELETED","PENDING_REVIEW","DISAPPROVED","PREAPPROVED","PENDING_BILLING_INFO","CAMPAIGN_PAUSED","ARCHIVED","ADSET_PAUSED","IN_PROCESS","WITH_ISSUES"]'
      fields: id,name,account_id,objective,status,effective_status,configured_status,buying_type,bid_strategy,daily_budget,lifetime_budget,budget_remaining,special_ad_categories,start_time,stop_time,created_time,updated_time
    absent:
    - after
    headers:
      authorization: Bearer meta_replay_token
  response:
    body:
      data:
      - id: '120000000000000001'
        name: Campaign 1
        account_id: '1234567890'
        objective: OUTCOME_SALES
        status: ACTIVE
        effective_status: ACTIVE
        configured_status: ACTIVE
        buying_type: AUCTION
        bid_strategy: LOWEST_COST_WITHOUT_CAP
        daily_budget: '5000'
        budget_remaining: '4200'
        special_ad_categories: []
        start_time: 2026-01-01T00:00:00-0800
        created_time: 2026-01-01T00:00:00-0800
        updated_time: 2026-08-01T10:00:00-0700
      paging:
        cursors:
          before: b0
          after: c1
        next: '{replay}/v25.0/act_1234567890/campaigns?limit=500&after=c1'
- match:
    path: /v25.0/act_1234567890/campaigns
    query:
      after: c1
  response:
