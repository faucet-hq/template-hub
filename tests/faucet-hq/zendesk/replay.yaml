# Recorded Zendesk exchanges (shapes from the API reference, values synthetic —
# no live credentials). Two runs: the incremental exports start from
# start_date, follow after_url/next_page, and the second run resumes with
# start_time=<epoch of the last updated_at>; groups pages through links.next.
