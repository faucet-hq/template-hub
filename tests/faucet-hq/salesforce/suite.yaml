# Parameter-space suite for faucet-hq/salesforce (faucet template test, #648).
# Validation tier: the composed pipeline (auth catalog, Bulk API 2.0 job,
# CSV decode) materializes, expands and compiles for every case. Behavioural
# tier: recorded CSV rows through the first stream's transforms. The HTTP side
# (OAuth refresh, job lifecycle, Sforce-Locator paging, SystemModstamp resume)
# is replay.yaml's job — see scripts/replay.py.
version: 1
template: source-templates/faucet-hq/salesforce.yaml
sink: sink-templates/faucet-hq/sqlite.yaml
suite:
  auto:
    required_omitted: true
    defaults_baseline: true
  cases:
    - name: production-org
      params: { salesforce_instance_url: "https://acme.my.salesforce.com", salesforce_client_id: 3MVG9replay, salesforce_client_secret: s, salesforce_refresh_token: r }
    - name: sandbox
      params: { salesforce_instance_url: "https://acme--uat.sandbox.my.salesforce.com", salesforce_login_url: "https://test.salesforce.com", salesforce_client_id: 3MVG9replay, salesforce_client_secret: s, salesforce_refresh_token: r }
  behavioral:
    - name: accounts-keep-api-field-names
      params: { salesforce_instance_url: "https://acme.my.salesforce.com", salesforce_client_id: 3MVG9replay, salesforce_client_secret: s, salesforce_refresh_token: r }
      input: tests/faucet-hq/salesforce/expected/accounts.jsonl
      expect:
        match: subset
        records:
          - { Id: 001xx000003DGb2AAG, Name: Globex, IsDeleted: "true", SystemModstamp: "2024-04-09T10:00:00.000Z" }
