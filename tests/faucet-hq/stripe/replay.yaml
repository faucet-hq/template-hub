    query:
      limit: '100'
    headers: &id001
      authorization: Bearer rk_test_replay
      stripe-version: 2026-08-26.dahlia
    absent:
    - starting_after
  response:
    body:
      object: list
      url: /v1/customers
      has_more: true
      data:
      - id: cus_Replay0001
        object: customer
        created: 1767312000
        email: ada@example.test
        name: Ada Example
        currency: usd
        balance: 0
        delinquent: false
        livemode: false
        metadata: {}
