# Recorded GA4 Data API exchanges (shapes from the runReport reference, values
# synthetic — no live credentials): the OAuth refresh-token grant, then
# runReport per stream with report_page_size=2, so offset/limit page through
# the request body — a short page ends a stream, and a full last page is
# followed by an empty one. events returns an empty report (GA4 omits `rows`),
# which yields no records. The expected records show each row's
# dimensionValues/metricValues zipped against the requested dimensions/metrics
# and snake_cased.
params:
  ga4_property_id: '123456789'
  google_client_id: replay.apps.googleusercontent.com
  google_client_secret: replay-secret
  google_refresh_token: 1//replay-refresh
  report_page_size: 2
  google_token_url: '{replay}/token'
  api_base_url: '{replay}'
exchanges:
- match:
    method: POST
    path: /token
    form:
      grant_type: refresh_token
      refresh_token: 1//replay-refresh
      client_id: replay.apps.googleusercontent.com
  response:
    body:
      access_token: ya29.replay
      expires_in: 3599
      scope: https://www.googleapis.com/auth/analytics.readonly
      token_type: Bearer
- match:
    method: POST
    path: /v1beta/properties/123456789:runReport
    headers: &id001
      authorization: Bearer ya29.replay
    body:
      dimensions: &id002
      - name: date
      - name: sessionDefaultChannelGroup
      metrics: &id003
      - name: sessions
      - name: totalUsers
      - name: newUsers
      - name: screenPageViews
      - name: engagementRate
      - name: keyEvents
      offset: 0
      limit: 2
      dateRanges:
      - startDate: 30daysAgo
        endDate: yesterday
  response:
    body:
      dimensionHeaders: &id004
      - name: date
      - name: sessionDefaultChannelGroup
      metricHeaders: &id005
      - name: sessions
        type: TYPE_INTEGER
      - name: totalUsers
        type: TYPE_INTEGER
      - name: newUsers
        type: TYPE_INTEGER
      - name: screenPageViews
        type: TYPE_INTEGER
      - name: engagementRate
        type: TYPE_INTEGER
      - name: keyEvents
        type: TYPE_INTEGER
      metadata: &id006
        currencyCode: EUR
        timeZone: Europe/Berlin
      kind: analyticsData#runReport
      rows:
      - dimensionValues:
        - value: '20260901'
        - value: Organic Search
        metricValues:
        - value: '1204'
        - value: '980'
        - value: '311'
        - value: '4410'
        - value: '0.63'
        - value: '57'
      - dimensionValues:
        - value: '20260901'
        - value: Direct
        metricValues:
        - value: '402'
        - value: '377'
        - value: '120'
        - value: '1022'
        - value: '0.55'
        - value: '9'
      rowCount: 3
- match:
    method: POST
    path: /v1beta/properties/123456789:runReport
    headers: *id001
    body:
      dimensions: *id002
      metrics: *id003
      offset: 2
      limit: 2
      dateRanges:
      - startDate: 30daysAgo
        endDate: yesterday
  response:
    body:
      dimensionHeaders: *id004
      metricHeaders: *id005
      metadata: *id006
