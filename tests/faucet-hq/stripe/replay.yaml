# Recorded Stripe exchanges (shapes from the API reference, values synthetic —
# no live credentials). Replayed by scripts/replay.py: two runs, so the
# incremental streams (balance_transactions, events) prove their created[gt]
# resume from the first run's bookmark.
runs: 2
overlay: ../../state-overlay.yaml
params:
  stripe_api_key: sk_test_replay
  api_base_url: '{replay}'
exchanges:
- match:
    path: /v1/customers
    query:
      limit: '100'
    headers: &id001
      authorization: Bearer sk_test_replay
      stripe-version: '2024-06-20'
    absent:
    - starting_after
  response:
    body:
      object: list
      url: /v1/customers
      has_more: true
      data:
      - id: cus_Q1a
        object: customer
        created: 1714000000
        email: ada@example.com
        name: Ada Lovelace
        currency: usd
        delinquent: false
        balance: 0
        livemode: false
        metadata:
          segment: smb
      - id: cus_Q2b
        object: customer
        created: 1714003600
        email: alan@example.com
        name: Alan Turing
        currency: usd
        delinquent: false
        balance: -500
        livemode: false
        metadata: {}
- match:
    path: /v1/customers
    query:
      limit: '100'
      starting_after: cus_Q2b
    headers: *id001
  response:
    body:
      object: list
      url: /v1/customers
      has_more: false
      data:
      - id: cus_Q3c
        object: customer
        created: 1714007200
        email: grace@example.com
        name: Grace Hopper
        currency: eur
        delinquent: true
        balance: 1200
        livemode: false
        metadata: {}
- match:
    path: /v1/customers
    query:
      limit: '100'
      starting_after: cus_Q3c
    headers: *id001
  response:
    body:
      object: list
      url: /v1/customers
      has_more: false
      data: []
- match:
    path: /v1/subscriptions
    query:
      limit: '100'
      status: all
    headers: *id001
    absent:
    - starting_after
  response:
    body:
      object: list
      url: /v1/subscriptions
      has_more: false
      data:
      - id: sub_1
        object: subscription
        customer: cus_Q1a
        status: canceled
        created: 1714100000
        current_period_start: 1714100000
        current_period_end: 1716692000
        cancel_at_period_end: false
        items:
          object: list
          data:
          - id: si_1
            price:
              id: price_1
            quantity: 1
- match:
    path: /v1/subscriptions
    query:
      limit: '100'
      status: all
      starting_after: sub_1
    headers: *id001
  response:
    body:
      object: list
      url: /v1/subscriptions
      has_more: false
      data: []
- match:
    path: /v1/invoices
    query:
      limit: '100'
    headers: *id001
    absent:
    - starting_after
  response:
    body:
      object: list
      url: /v1/invoices
      has_more: false
      data:
      - id: in_1
        object: invoice
        customer: cus_Q1a
        subscription: sub_1
        status: paid
        amount_due: 4900
        amount_paid: 4900
        currency: usd
        created: 1714100100
        period_start: 1714100000
        period_end: 1716692000
- match:
    path: /v1/invoices
