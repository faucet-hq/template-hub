# Shopify — orders, customers, products, collections and locations over the
# Admin REST API.
#   faucet run --source faucet-hq/shopify --sink faucet-hq/bigquery \
#     --param shopify_store_url=https://acme.myshopify.com --param shopify_access_token="$SHOPIFY_TOKEN" …
# Scopes, run times and the changelog: shopify.md beside this file.
kind: source-template
name: shopify
owner: faucet-hq
description: Shopify — orders, customers, products (incremental on updated_at), custom and smart collections and locations (Admin REST API 2025-07)
tags: [ecommerce, retail, saas]
docs: https://shopify.dev/docs/api/admin-rest
params:
  shopify_store_url:    { type: string, required: true, description: "Store admin root, e.g. https://acme.myshopify.com" }
  shopify_access_token: { type: string, required: true, secret: true, description: "Custom app Admin API access token (shpat_…)" }
  start_date:           { type: string, default: "2000-01-01T00:00:00Z", description: "Earliest update to read on the first run (RFC 3339)" }
source:
  type: rest
  config:
    base_url: "${param.shopify_store_url}"
    auth: { type: api_key, config: { header: X-Shopify-Access-Token, value: "${param.shopify_access_token}" } }
    query_params: { limit: "250" }
    pagination: { type: LinkHeader }
    max_pages: null
    max_retries: 8
streams:
  - name: orders
    source:
      config:
        path: "/admin/api/2025-07/orders.json?updated_at_min={updated_at_min}"
        query_params: { status: any }
        records_path: $.orders[*]
        replication_method: { type: Incremental }
        replication_key: updated_at
        start_replication_value: "${param.start_date}"
        replication_bind: { into: path, name: updated_at_min, format: iso8601 }
    primary_keys: [id]
    write: [upsert, overwrite]
  - name: customers
    source:
      config:
        path: "/admin/api/2025-07/customers.json?updated_at_min={updated_at_min}"
        records_path: $.customers[*]
        replication_method: { type: Incremental }
        replication_key: updated_at
        start_replication_value: "${param.start_date}"
        replication_bind: { into: path, name: updated_at_min, format: iso8601 }
    primary_keys: [id]
    write: [upsert, overwrite]
  - name: products
    source:
      config:
        path: "/admin/api/2025-07/products.json?updated_at_min={updated_at_min}"
        records_path: $.products[*]
        replication_method: { type: Incremental }
        replication_key: updated_at
        start_replication_value: "${param.start_date}"
        replication_bind: { into: path, name: updated_at_min, format: iso8601 }
    primary_keys: [id]
    write: [upsert, overwrite]
  - name: custom_collections
    source: { config: { path: /admin/api/2025-07/custom_collections.json, records_path: "$.custom_collections[*]" } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: smart_collections
    source: { config: { path: /admin/api/2025-07/smart_collections.json, records_path: "$.smart_collections[*]" } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: locations
    source: { config: { path: /admin/api/2025-07/locations.json, records_path: "$.locations[*]" } }
    primary_keys: [id]
    write: [overwrite, upsert]
