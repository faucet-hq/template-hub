# HubSpot CRM — contacts, companies, deals, tickets, products, owners and deal
# pipelines over the CRM v3 API.
#   faucet run --source faucet-hq/hubspot --sink faucet-hq/postgres --param hubspot_token="$HUBSPOT_TOKEN" …
# Scopes, run times and the changelog: hubspot.md beside this file.
kind: source-template
name: hubspot
owner: faucet-hq
description: HubSpot CRM — contacts, companies, deals, tickets, products, owners and deal pipelines (CRM v3), properties lifted to columns
tags: [crm, marketing, sales, saas]
docs: https://developers.hubspot.com/docs/api/crm/understanding-the-crm
params:
  hubspot_token:      { type: string, required: true, secret: true, description: "Private app access token (Settings → Integrations → Private Apps)" }
  contact_properties: { type: string, default: "email,firstname,lastname,phone,company,jobtitle,lifecyclestage,hs_lead_status,hubspot_owner_id,createdate,lastmodifieddate", description: "Comma-separated contact properties to read" }
  company_properties: { type: string, default: "name,domain,industry,city,state,country,numberofemployees,annualrevenue,lifecyclestage,hubspot_owner_id,createdate,hs_lastmodifieddate", description: "Comma-separated company properties to read" }
  deal_properties:    { type: string, default: "dealname,amount,dealstage,pipeline,closedate,dealtype,hubspot_owner_id,hs_is_closed_won,createdate,hs_lastmodifieddate", description: "Comma-separated deal properties to read" }
  ticket_properties:  { type: string, default: "subject,content,hs_pipeline,hs_pipeline_stage,hs_ticket_priority,hs_ticket_category,hubspot_owner_id,closed_date,createdate,hs_lastmodifieddate", description: "Comma-separated ticket properties to read" }
  product_properties: { type: string, default: "name,description,price,hs_sku,hs_recurring_billing_period,createdate,hs_lastmodifieddate", description: "Comma-separated product properties to read" }
  api_base_url:       { type: string, default: "https://api.hubapi.com", description: "API root — override only to replay recorded fixtures" }
source:
  type: rest
  config:
    base_url: "${param.api_base_url}"
    auth: { type: bearer, config: { token: "${param.hubspot_token}" } }
    query_params: { limit: "100", archived: "false" }
    records_path: $.results[*]
    pagination: { type: Cursor, next_token_path: $.paging.next.after, param_name: after }
    max_pages: null
    max_retries: 6
transforms:
  - { type: flatten, config: { separator: "__" } }
  - { type: rename_keys, config: { pattern: "^properties__", replacement: "" } }
  - { type: keys_case, config: { mode: snake } }
streams:
  - name: contacts
    source: { config: { path: /crm/v3/objects/contacts, query_params: { properties: "${param.contact_properties}" } } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: companies
    source: { config: { path: /crm/v3/objects/companies, query_params: { properties: "${param.company_properties}" } } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: deals
    source: { config: { path: /crm/v3/objects/deals, query_params: { properties: "${param.deal_properties}" } } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: tickets
    source: { config: { path: /crm/v3/objects/tickets, query_params: { properties: "${param.ticket_properties}" } } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: products
    source: { config: { path: /crm/v3/objects/products, query_params: { properties: "${param.product_properties}" } } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: owners
    source: { config: { path: /crm/v3/owners } }
    primary_keys: [id]
    write: [overwrite, upsert]
  - name: deal_pipelines
    source: { config: { path: /crm/v3/pipelines/deals, query_params: { archived: "false" }, pagination: { type: None } } }
    primary_keys: [id]
    write: [overwrite, upsert]
