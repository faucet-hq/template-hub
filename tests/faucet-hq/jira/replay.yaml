# Recorded Jira Cloud REST v3 exchanges (shapes from the API reference, values
# synthetic — no live credentials). issues pages through nextPageToken,
# projects through nextPage, users through startAt/maxResults.
params:
  jira_url: '{replay}'
  jira_email: ops@example.com
  jira_api_token: jira_replay
exchanges:
- match:
    path: /rest/api/3/search/jql
    headers: &id001
      authorization: Basic b3BzQGV4YW1wbGUuY29tOmppcmFfcmVwbGF5
      accept: application/json
    query:
      jql: updated >= "2000-01-01" ORDER BY updated ASC
      fields: '*navigable'
      maxResults: '100'
    absent:
    - nextPageToken
  response:
    body:
      issues:
      - id: '10001'
        key: ENG-1
        self: https://example.atlassian.net/rest/api/3/issue/10001
        fields:
          summary: Login page 500s
          status:
            id: '3'
            name: In Progress
            statusCategory:
              key: indeterminate
          issuetype:
            id: '10004'
            name: Bug
          priority:
            id: '2'
            name: High
          assignee:
            accountId: 5b10ac8d82e05b22cc7d4ef5
            displayName: Mia Krystof
          project:
            id: '10000'
            key: ENG
          created: 2024-04-01T10:00:00.000+0000
          updated: 2024-04-02T10:00:00.000+0000
          customfield_10016: 5
      nextPageToken: CAEaAggD
      isLast: false
- match:
    path: /rest/api/3/search/jql
    headers: *id001
    query:
      jql: updated >= "2000-01-01" ORDER BY updated ASC
      fields: '*navigable'
      maxResults: '100'
      nextPageToken: CAEaAggD
  response:
    body:
      issues:
      - id: '10002'
        key: ENG-2
        self: https://example.atlassian.net/rest/api/3/issue/10002
        fields:
          summary: Dark mode
          status:
            id: '1'
            name: To Do
            statusCategory:
              key: new
          issuetype:
            id: '10001'
            name: Story
          priority:
            id: '3'
            name: Medium
          assignee: null
          project:
            id: '10000'
            key: ENG
          created: 2024-04-03T10:00:00.000+0000
          updated: 2024-04-03T10:00:00.000+0000
          customfield_10016: null
      isLast: true
- match:
    path: /rest/api/3/project/search
    headers: *id001
    query:
      maxResults: '50'
      expand: description,lead
    absent:
    - startAt
  response:
    body:
      values:
      - id: '10000'
        key: ENG
        name: Engineering
        projectTypeKey: software
        simplified: false
        style: classic
        isPrivate: false
        lead: &id002
          accountId: 5b10ac8d82e05b22cc7d4ef5
          displayName: Mia Krystof
        description: Core product
      startAt: 0
      maxResults: 50
      total: 2
      isLast: false
      nextPage: '{replay}/rest/api/3/project/search?startAt=50&maxResults=50&expand=description,lead'
- match:
    path: /rest/api/3/project/search
    headers: *id001
    query:
      startAt: '50'
      maxResults: '50'
  response:
    body:
      values:
      - id: '10001'
        key: OPS
        name: Operations
        projectTypeKey: software
        simplified: false
        style: classic
        isPrivate: false
        lead: *id002
        description: Runbooks
      startAt: 50
      maxResults: 50
      total: 2
      isLast: true
- match:
    path: /rest/api/3/users/search
    headers: *id001
    query:
      startAt: '0'
      maxResults: '100'
  response:
    body:
    - accountId: 5b10ac8d82e05b22cc7d4ef5
      accountType: atlassian
      displayName: Mia Krystof
      emailAddress: mia@example.com
      active: true
      timeZone: Australia/Sydney
      locale: en_US
- match:
    path: /rest/api/3/field
    headers: *id001
  response:
    body:
    - id: customfield_10016
      key: customfield_10016
      name: Story point estimate
      custom: true
      orderable: true
      navigable: true
      searchable: true
      schema:
        type: number
        custom: com.pyxis.greenhopper.jira:jsw-story-points
        customId: 10016
    - id: summary
      key: summary
      name: Summary
      custom: false
      orderable: true
      navigable: true
      searchable: true
      schema:
        type: string
        system: summary
- match:
    path: /rest/api/3/status
    headers: *id001
  response:
    body:
    - id: '3'
      name: In Progress
      statusCategory:
        id: 4
        key: indeterminate
        name: In Progress
      scope:
        type: PROJECT
        project:
          id: '10000'
- match:
    path: /rest/api/3/issuetype
    headers: *id001
  response:
    body:
    - id: '10004'
      name: Bug
      subtask: false
      hierarchyLevel: 0
      description: A problem which impairs or prevents the functions of the product.
