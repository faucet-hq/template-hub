          interactions: '9'
          conversions: '1.5'
          conversionsValue: '42.0'
          allConversions: '2.5'
          viewThroughConversions: '1'
      fieldMask: customer.id,segments.date,campaign.id,adGroup.id,metrics.impressions,metrics.clicks,metrics.costMicros,metrics.interactions,metrics.conversions,metrics.conversionsValue,metrics.allConversions,metrics.viewThroughConversions
