# Recorded Stripe list exchanges, rebuilt from the documented response shapes
# (https://docs.stripe.com/api) with synthetic ids and values.
# Two runs: the second resumes the windowed streams from their bookmark.
runs: 2
overlay: ../../state-overlay.yaml
params:
  stripe_api_key: rk_test_replay
  api_base_url: '{replay}'
  stripe_start_date: '2026-01-01T00:00:00Z'
