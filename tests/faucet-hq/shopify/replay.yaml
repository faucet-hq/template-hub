# Recorded Shopify GraphQL Admin API (2026-07) exchanges for faucet-hq/shopify,
# built from the documented query responses (nodes + pageInfo, cost
# extensions) with synthetic values. The client-credentials token exchange is
# served by the replay. orders pages twice (endCursor → $after); the second run
# resumes every incremental stream from its bookmark through the `query`
# variable (orders returns an updated order, the others nothing new). The
# page-2 exchange carries an extra constraint so it outranks page 1's (a JSON
# subset match would otherwise accept either).
runs: 2
overlay: ../../state-overlay.yaml
params:
  shopify_shop_url: '{replay}'
  shopify_client_id: replay-client-id
  shopify_client_secret: replay-client-secret
exchanges:
- match:
    method: POST
    path: /admin/oauth/access_token
    form:
      grant_type: client_credentials
      client_id: replay-client-id
      client_secret: replay-client-secret
  response:
    body:
      access_token: shpat_replay_token
      scope: read_orders,read_customers,read_products,read_locations
      expires_in: 86399
- match:
    method: POST
    path: /admin/api/2026-07/graphql.json
    headers:
      x-shopify-access-token: shpat_replay_token
    body:
      query: 'query Orders($first: Int, $after: String, $query: String) { orders(first: $first, after: $after, query: $query, sortKey: UPDATED_AT) { nodes { id name createdAt updatedAt processedAt cancelledAt cancelReason closedAt displayFinancialStatus
        displayFulfillmentStatus currencyCode presentmentCurrencyCode email test confirmed tags note sourceName totalPriceSet { shopMoney { amount currencyCode } } subtotalPriceSet { shopMoney { amount currencyCode } } totalTaxSet { shopMoney { amount
        currencyCode } } totalDiscountsSet { shopMoney { amount currencyCode } } totalShippingPriceSet { shopMoney { amount currencyCode } } currentTotalPriceSet { shopMoney { amount currencyCode } } totalRefundedSet { shopMoney { amount currencyCode }
        } customer { id } billingAddress { countryCodeV2 provinceCode city zip } shippingAddress { countryCodeV2 provinceCode city zip } } pageInfo { hasNextPage endCursor } } }'
      variables:
        first: 50
        query: updated_at:>'2006-01-01T00:00:00Z'
